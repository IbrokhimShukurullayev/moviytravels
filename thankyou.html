<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Ma'lumotingiz muvaffaqiyatli yuborildi!</title>

    <!-- Bootstrap va Fontlar -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.1/css/all.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Facebook Pixel (Statik versiya, agar kerak bo‘lsa) -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(
        window,
        document,
        "script",
        "https://connect.facebook.net/en_US/fbevents.js"
      );

      // Pixel ID bu yerga qo‘lda yoziladi (agar ishlatilsa)
      fbq("init", "PIXEL_ID_BU_YERDA");
      fbq("track", "Lead");
    </script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      a {
        text-decoration: none !important;
      }
      .success_section {
        min-height: 100vh;
        background: #17df63;
        padding: 0 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .success_icon {
        width: 80px;
        height: 80px;
        background: #15e062 url("data:image/png;base64,...") no-repeat center;
        background-size: 50%;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 0 0 12px rgba(255, 255, 255, 0.15),
          0 0 0 26px rgba(255, 255, 255, 0.15);
        margin-bottom: 1rem;
      }
      h2,
      h3,
      p {
        color: #fff;
        font-family: "Open Sans", sans-serif;
      }
      h2 {
        font-weight: 700;
        letter-spacing: 0.3px;
        margin-top: 1rem;
      }
      h3 {
        font-weight: 700;
        letter-spacing: 0.3px;
        margin: 0;
      }
      p {
        margin-top: 1rem;
        letter-spacing: 0.5px;
      }
      button {
        margin-top: 1rem;
        padding: 10px 25px;
        color: #fff;
        font-weight: 600;
        border: 2px solid #fff;
        background: rgba(255, 255, 255, 0.158);
        border-radius: 2px;
        transition: 0.2s;
        font-family: "Open Sans", sans-serif;
      }
      button:hover {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="success_section">
      <div class="success_icon"></div>
      <h2>Rahmat.</h2>
      <h3>Buyurtma qabul qilindi!</h3>
      <p>
        Yaqin orada sizga bizning operatorimiz qo'ng'iroq qiladi. <br />
        <span style="color: red"
          ><b>ILTIMOS TELEFONINGIZNI YONINGIZDA OLIB YURING</b></span
        >
      </p>
      <button onclick="history.back();">
        <i class="fas fa-arrow-left pr-2"></i> Saytga qaytish
      </button>
    </div>
  </body>
</html>
